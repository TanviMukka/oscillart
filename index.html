    <link href="style.css" rel="stylesheet"/>
</head>
<body>
    <div id="container">
        <!--gets the input from user-->
        <input type="text" id="input">

        <input type="range" min="1" max="100" value="100" id="vol-slider">
        <canvas id="canvas">
            
        </canvas>
    </div>
    <script src="main.js"></script>
</body>
